name: Build and Release John the Ripper

on:
  push:
    branches: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: "1.9.0-Jumbo-1"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        repository: openwall/john
        ref: bleeding-jumbo
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libssl-dev \
          libpcap-dev \
          libkrb5-dev \
          libgmp-dev \
          libnss3-dev \
          libbz2-dev \
          zlib1g-dev \
          autoconf \
          pkg-config \
          perl \
          cpanminus \
          python3 \
          python3-pip \
          python3-venv \
          opencl-headers \
          ocl-icd-libopencl1 \
          ocl-icd-opencl-dev \
          pocl-opencl-icd
    
    - name: Install Perl dependencies
      run: |
        cd src
        cpanm --notest --installdeps . || true
    
    - name: Configure build
      run: |
        cd src
        ./configure --enable-opencl
    
    - name: Compile
      run: |
        cd src
        make -s clean
        make -sj$(nproc)
    
    - name: Prepare release package
      run: |
        VERSION="1.9.0-Jumbo-1"
        
        # 创建发布目录
        mkdir -p john-the-ripper-$VERSION
        
        # 复制所有运行文件
        cp -r run/* john-the-ripper-$VERSION/
        
        # 清理不必要的文件
        cd john-the-ripper-$VERSION
        rm -rf *.o *.d core *.pot 2>/dev/null || true
        rm -rf logs/ 2>/dev/null || true
        
        cd ..
        
        # 创建 tar 压缩包
        tar -czf john-the-ripper-$VERSION-linux-x86_64.tar.gz john-the-ripper-$VERSION/
        
        # 创建校验和
        sha256sum john-the-ripper-$VERSION-linux-x86_64.tar.gz > john-the-ripper-$VERSION-linux-x86_64.tar.gz.sha256
        
        echo "Release package created for version: $VERSION"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: john-the-ripper-1.9.0-Jumbo-1
        path: |
          john-the-ripper-*.tar.gz
          *.sha256
        if-no-files-found: error

  # 直接发布
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: john-the-ripper-1.9.0-Jumbo-1
        path: release-artifacts/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build.outputs.version }}
        name: "John the Ripper ${{ needs.build.outputs.version }}"
        body: |
          ## John the Ripper Jumbo Edition - Automated Build
          
          This is an automated build from the bleeding-jumbo branch.
          
          ### System requirements
          - Linux x86_64
          - glibc 2.31 or later
          
          ### Usage
          ```bash
          tar -xzf john-the-ripper-${{ needs.build.outputs.version }}-linux-x86_64.tar.gz
          cd john-the-ripper-${{ needs.build.outputs.version }}
          ./john --test

        files: |
          release-artifacts/.tar.gz
          release-artifacts/.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
